name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Posts go live at 09:00 America/New_York. GitHub cron is UTC, ignores DST (EDT: 13, EST: 14) and often
    # delays or skips scheduled runs, so run every hour from 13:02 to 23:02 UTC (09:02-19:02 EDT). A skipped
    # run then delays a post by at most an hour. Posts dated in the future go live on the next run after their date.
    - cron: '2 13-23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: '22'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
